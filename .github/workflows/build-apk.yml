name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: pip install flet-cli==1.0.5 flet==1.0.5 flet-charts==1.0.5

      - name: Build APK
        run: flet build apk --verbose --no-rich-output

      - uses: actions/upload-artifact@v4
        with:
          name: merienda-apk
          path: build/apk/